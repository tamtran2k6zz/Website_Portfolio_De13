groups:
  - name: deployment-health
    rules:
      - alert: ScrapeTargetDown
        expr: up{job!="prometheus"} == 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Exporter {{ $labels.job }} unavailable"}
      - alert: MySQLUnavailable
        expr: mysql_up == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "MySQL exporter cannot connect to database"}
      - alert: NginxUnavailable
        expr: nginx_up == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Nginx exporter cannot reach stub_status"}
