services:
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    restart: unless-stopped
    privileged: true
    devices: ["/dev/kmsg:/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command: ["--docker_only=true", "--housekeeping_interval=15s"]
    networks: [monitoring]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.1
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8082/stub_status"]
    networks: [web, monitoring]
    depends_on: [nginx]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  mysql-exporter:
    image: prom/mysqld-exporter:v0.17.2
    restart: unless-stopped
    command: ["--config.my-cnf=/etc/exporter/my.cnf", "--mysqld.address=mysql:3306"]
    volumes: ["./secrets/exporter.cnf:/etc/exporter/my.cnf:ro"]
    networks: [database, monitoring]
    depends_on:
      mysql: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    ports: ["127.0.0.1:9090:9090"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [monitoring]
    depends_on: [cadvisor, nginx-exporter, mysql-exporter]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run setup.py}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [monitoring]
    depends_on: [prometheus]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  monitoring: {}
volumes:
  prometheus_data: {}
  grafana_data: {}

