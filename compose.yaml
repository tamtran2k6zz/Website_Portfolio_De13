name: de13-portfolio

services:
  init-logs:
    image: busybox:1.37.0
    user: "0:0"
    restart: "no"
    network_mode: none
    command: ["sh", "-c", "chown 1000:1000 /app-logs && chmod 755 /app-logs && chown 101:101 /nginx-logs && chmod 755 /nginx-logs"]
    volumes:
      - app_logs:/app-logs
      - nginx_logs:/nginx-logs

  mysql:
    image: mysql:8.4.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: portfolio
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run python3 scripts/setup.py}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run setup.py}
      MYSQL_MONITOR_PASSWORD: ${MYSQL_MONITOR_PASSWORD:?Run setup.py}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=socket -uroot -Nse \"SELECT COUNT(*) FROM portfolio.skills\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    security_opt: ["no-new-privileges:true"]

  app:
    build: ./app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run setup.py}
      SESSION_SECRET: ${SESSION_SECRET:?Run setup.py}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Run setup.py}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_DIR: /app/logs
    volumes: ["app_logs:/app/logs"]
    networks: [web, database]
    depends_on:
      mysql: {condition: service_healthy}
      init-logs: {condition: service_completed_successfully}
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  nginx:
    image: nginx:1.28.0-alpine
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    restart: unless-stopped
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/logs
    tmpfs: ["/tmp:size=64m,mode=1777"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [web]
    depends_on:
      app: {condition: service_healthy}
      init-logs: {condition: service_completed_successfully}

  phpmyadmin:
    image: phpmyadmin:5.2.2
    restart: unless-stopped
    ports: ["127.0.0.1:${PMA_PORT:-8081}:80"]
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: "0"
      UPLOAD_LIMIT: 16M
    networks: [management, database]
    depends_on:
      mysql: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]

networks:
  web: {}
  management: {}
  database: {internal: true}

volumes:
  mysql_data: {}
  app_logs: {}
  nginx_logs: {}
